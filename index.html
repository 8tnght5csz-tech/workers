<title>Workers</title>

<style>
:root{--bg:#000;--fg:#f2f2f2;--dim:#8a8a8a;--line:#d9d9d9;--panel:#0c0c0c;--red:#9b1c1c}
*{touch-action:manipulation;-webkit-text-size-adjust:100%;box-sizing:border-box}
body{margin:0;font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--fg)}
.box{padding:20px 18px;max-width:440px;margin:auto}
h1{font-weight:400;text-align:center;letter-spacing:.3em;font-size:20px;margin:14px 0 18px;text-transform:uppercase}
.logo{display:block;width:96px;height:96px;margin:6px auto 0;border-radius:50%}
input,button,select,textarea{width:100%;padding:13px;margin:6px 0;border:1px solid var(--line);border-radius:0;font-size:16px;font-family:inherit;background:var(--bg);color:var(--fg)}
button{background:var(--fg);color:var(--bg);letter-spacing:.12em;cursor:pointer}
.link{background:none;color:var(--dim);border:0}
.ghost{background:var(--bg);color:var(--fg)}
.red{background:var(--bg);color:#e05252;border-color:#e05252}
.err{color:#e05252;text-align:center;min-height:20px;font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg);border-top:3px double var(--line);z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;color:var(--dim);border:0;margin:0;font-size:12px;letter-spacing:.08em}
nav button.on{color:var(--fg);text-decoration:underline;text-underline-offset:6px}
.card{border:1px solid var(--line);outline:1px solid var(--line);outline-offset:3px;padding:16px;margin:14px 4px;background:var(--panel);line-height:1.6}
.room{background:var(--panel);color:var(--fg);text-align:left;letter-spacing:.04em}
.msgs{height:calc(100vh - 240px);overflow-y:auto;padding:4px}
.m{border:1px solid #333;padding:8px 12px;margin:6px 0;max-width:85%;word-wrap:break-word}
.m.me{margin-left:auto;border-color:var(--line)}
.m b{font-size:12px;display:block;color:var(--dim);font-weight:400}
.send{display:flex;gap:6px}.send input{flex:1}.send button{width:64px}
.row{display:flex;gap:6px}
small{color:var(--dim)}
.seal{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border:1px solid var(--line);border-radius:50%;outline:1px solid var(--line);outline-offset:3px;font-size:22px;margin:0 12px 0 4px;vertical-align:middle}
.who{display:flex;align-items:center;margin-bottom:10px}
.ul{display:flex;align-items:center}.ul .seal{width:34px;height:34px;font-size:16px;margin-right:10px;outline:0}
</style>

function shrink(file,max,q,sq){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{let w=i.width,h=i.height,sx=0,sy=0;if(sq){const m=Math.min(w,h);sx=(w-m)/2;sy=(h-m)/2;w=h=m}const k=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(i,sx,sy,w,h,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};i.onerror=rej;i.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

}

 else if(ME.rank==='General'){o.push(['g'+ME.general,'Бүт тобума']);for(let k=1;k<=10;k++)o.push(['g'+ME.general+'m'+k,'Medium '+k+' тобу'])}
 else o.push(['g'+ME.general+'m'+ME.medium,'Тобума']);
 app.innerHTML=`<h1>Миссия берүү</h1><input id="mt" placeholder="Аталышы"><textarea id="mb" rows="4" placeholder="Тапшырма тексти"></textarea>
 <select id="mg">${o.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select>
 <input id="mn" placeholder="Же бир адамга: никнейм (милдеттүү эмес)" autocapitalize="off">${isBoss()?'<input id="mr" type="number" placeholder="Сыйлык: акча (10-уровеньдегилерге)">':''}<div class="err" id="err"></div>
 <button onclick="saveMission()">ЖӨНӨТҮҮ</button><button class="link" onclick="bossPanel()">← Артка</button>`;
}
async function saveMission(){
 const title=$('mt').value.trim(),body=$('mb').value.trim(),to=$('mn').value.trim(),grp=$('mg').value;
 if(!title||!body)return err('Аталышы жана текстин жаз');
 const {e}=await R('ww_give_mission',{p_title:title,p_body:body,p_to:to,p_grp:grp,p_reward:parseInt(($('mr')||{}).value)||0});
 if(e)return err('Ката: '+e);
 alert('Миссия жөнөтүлдү');bossPanel();
}
async function submissionsView(){
 const {d,e}=await R('ww_subs');
 window.SUBS=d||[];
 let h='<h1>Жооптор</h1>';
 if(e)h+='<div class="card">'+esc(e)+'</div>';
 else if(!SUBS.length)h+='<div class="card">Жаңы жооп жок</div>';
 SUBS.forEach((s,i)=>{h+=`<div class="card"><b>${esc(s.nick)}</b> · <small>${esc(s.title||'')}</small><br>${esc(s.answer)}${s.photo?'<br><img src="'+s.photo+'" style="max-width:100%;margin-top:6px">':''}
  <div class="row"><button onclick="review(${i},true)">КАБЫЛ</button><button class="red" onclick="review(${i},false)">ЖОК</button></div></div>`});
 app.innerHTML=h+`<button class="link" onclick="bossPanel()">← Артка</button>`;
}
async function review(i,ok){
 const s=SUBS[i];
 const {e}=await R('ww_review',{p_id:s.id,p_ok:ok});
 if(e)alert('Ката: '+e);
 submissionsView();
}
async function ordersView(kind){
 const T=kind==='info'?'Маалымат алуу':kind==='payout'?'Төлөмдөр':'Буйрутма берүү';
 const {d,e}=await R('ww_orders',{p_kind:kind});
 const list=window.ORD=d||[];window.OKIND=kind;
 const st={new:'Баасын күтүүдө',priced:'Баасы коюлду',accepted:'Кабыл алынды, иштелүүдө',rejected:'Четке кагылды',done:'Даяр'};
 let h=`<h1>${T}</h1>`;
 if(e)h+=`<div class="card">${esc(e)}</div>`;
 if(!isBoss()&&kind!=='payout')h+=`<textarea id="ot" rows="4" placeholder="${kind==='info'?'Кандай маалымат керек?':'Эмне буйрутма бересиз?'}"></textarea><button onclick="orderSend()">ЖӨНӨТҮҮ</button>`;
 if(!list.length&&!e)h+='<div class="card">Азырынча бош</div>';
 list.forEach((o,i)=>{
  h+=`<div class="card"><small>${isBoss()?esc(o.nick)+' · ':''}${st[o.status]||''}</small><br>${esc(o.text)}${o.price?`<br><b>${o.kind==='payout'?'Сумма':'Баасы'}: ${esc(o.price)}</b>`:''}${o.note?`<br>${esc(o.note)}`:''}${o.reply?`<br><b>Жооп:</b> ${esc(o.reply)}`:''}`;
  if(isBoss()){
   if(o.status==='new')h+=`<input id="p${i}" placeholder="Баасы (мис. 500 сом)"><input id="n${i}" placeholder="Эскертме (милдеттүү эмес)"><button onclick="orderBoss(${i},'price')">БААСЫН КОЮУ</button>`;
   if(o.status==='accepted')h+=`<textarea id="r${i}" rows="3" placeholder="Жооп / натыйжа"></textarea><button onclick="orderBoss(${i},'done')">АТКАРЫЛДЫ</button>`;
   if(['new','priced','accepted'].includes(o.status))h+=`<button class="red" onclick="orderBoss(${i},'reject')">ЖОККО ЧЫГАРУУ</button>`;
   h+=`<button class="ghost" onclick="BACK=()=>ordersView('${kind}');openRoom('dm:${esc(o.nick)}','${esc(o.nick)}')">Жазуу</button>`;
  }else{
   if(o.status==='priced')h+=`<div class="row"><button onclick="orderAns(${i},true)">КАБЫЛ АЛАМ</button><button class="red" onclick="orderAns(${i},false)">ЖОК</button></div>`;
   h+=`<button class="ghost" onclick="BACK=()=>ordersView('${kind}');openRoom('dm:${esc(ME.nick)}','Boss менен жазуу')">Boss менен жазуу</button>`;
  }
  h+='</div>';
 });
 app.innerHTML=h+`<button class="link" onclick="home('main')">← Артка</button>`+navHTML('main');
}
async function orderSend(){
 const t=$('ot').value.trim();if(!t)return;
 const {e}=await R('ww_order_create',{p_kind:OKIND,p_text:t});
 if(e)return alert('Ката: '+e);
 ordersView(OKIND);
}
async function orderAns(i,ok){
 const {e}=await R('ww_order_answer',{p_id:ORD[i].id,p_accept:ok});
 if(e)alert('Ката: '+e);
 ordersView(OKIND);
}
async function orderBoss(i,a){
 const o=ORD[i];
 const {e}=await R('ww_order_boss',{p_id:o.id,p_action:a,p_price:a==='price'?$('p'+i).value:'',p_note:a==='price'?$('n'+i).value:'',p_reply:a==='done'?$('r'+i).value:''});
 if(e)alert('Ката: '+e);
 ordersView(OKIND);
}
async function autoLink(){
 try{if(tg.requestWriteAccess)tg.requestWriteAccess(()=>{})}catch(x){}
 try{const r=await fetch('https://ccklzmzukvmacfgelpym.supabase.co/functions/v1/bot-?link=1',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:localStorage.getItem('tok'),initData:tg.initData})});
 if(r.ok&&ME)ME.tg=true}catch(x){}
}
async function tgOn(){
 const {d,e}=await R('ww_tg_code');if(e)return alert('Ката: '+e);
 app.innerHTML=`<h1>Эскертүү</h1><div class="card">1. <b>@workers_all_bot</b> чатын ач.<br>2. Ушуну жөнөт:<br><br><b style="font-size:20px">/link ${esc(d)}</b><br><br><small>Код 10 мүнөт иштейт.</small></div><button onclick="ME=null;home('me')">ДАЯР</button>`;
}
async function tgOff(){await R('ww_tg_unlink');ME=null;home('me')}
function payoutView(){
 app.innerHTML=`<h1>Акча чыгаруу</h1><div class="card">Баланс: <b>${ME.balance||0}</b></div><input id="pa" type="number" placeholder="Сумма"><div class="err" id="err"></div><button onclick="payoutDo()">СУРОО ЖӨНӨТҮҮ</button><button class="ghost" onclick="ordersView('payout')">Менин суроолорум</button><button class="link" onclick="home('me')">← Артка</button>`;
}
async function payoutDo(){
 const a=parseInt($('pa').value);
 if(!a||a<1)return err('Суммасын жаз');
 const {e}=await R('ww_payout',{p_amount:a});
 if(e)return err('Ката: '+e);
 ME.balance=(ME.balance||0)-a;ordersView('payout');
}
function logout(){localStorage.removeItem('tok');localStorage.removeItem('me');ME=null;authView(false)}
localStorage.getItem('tok')?home('main'):authView(true);
</script>
</body>
</html>
