<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;font-family:sans-serif;background:#111;color:#fff}
.box{padding:24px 20px;max-width:420px;margin:auto}
h1{color:#f5c542;text-align:center}
input,button{width:100%;padding:14px;margin:6px 0;border-radius:10px;border:0;font-size:16px;box-sizing:border-box}
input{background:#222;color:#fff}
button{background:#f5c542;color:#000;font-weight:bold}
.link{background:none;color:#f5c542;font-weight:normal}
.err{color:#ff6b6b;text-align:center;min-height:20px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#1c1c1c}
nav button{background:none;color:#aaa;border-radius:0;margin:0;font-size:13px}
nav button.on{color:#f5c542}
.card{background:#1c1c1c;padding:16px;border-radius:12px;margin:10px 0}
</style>
</head>
<body>
<div class="box" id="app"></div>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();
const app=document.getElementById('app');
const get=k=>JSON.parse(localStorage.getItem(k)||'null');
const set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));

function authView(reg){
 app.innerHTML=`<h1>Workers</h1>
 ${reg?`<input id="fn" placeholder="Аты">
 <input id="ln" placeholder="Фамилия">
 <input id="age" type="number" placeholder="Жашы">`:''}
 <input id="nick" placeholder="Никнейм">
 <input id="pw" type="password" placeholder="Пароль">
 <div class="err" id="err"></div>
 <button onclick="${reg?'register()':'login()'}">${reg?'Каттоо':'Кирүү'}</button>
 <button class="link" onclick="authView(${!reg})">${reg?'Аккаунт бар, кирүү':'Жаңы аккаунт ачуу'}</button>`;
}
function err(t){document.getElementById('err').textContent=t}
function register(){
 const u={fn:fn.value.trim(),ln:ln.value.trim(),age:age.value,nick:nick.value.trim(),pw:pw.value,rank:'Worker',level:1};
 if(!u.fn||!u.ln||!u.age||!u.nick||u.pw.length<4)return err('Баарын толтур, пароль 4+ белги');
 const users=get('users')||{};
 if(users[u.nick])return err('Бул никнейм бош эмес');
 users[u.nick]=u;set('users',users);set('me',u.nick);home('main');
}
function login(){
 const users=get('users')||{};const u=users[nick.value.trim()];
 if(!u||u.pw!==pw.value)return err('Никнейм же пароль туура эмес');
 set('me',u.nick);home('main');
}
function home(tab){
 const u=(get('users')||{})[get('me')];if(!u)return authView(true);
 const t={
  main:'<h1>Главный</h1><div class="card">Маалымат сатып алуу / буйрутма бөлүмү (жакында)</div>',
  chat:'<h1>Чат</h1><div class="card">Генералдардын жана Медиумдардын чаттары (жакында)</div>',
  mission:'<h1>Миссия</h1><div class="card">Тапшырмалар (жакында)</div>',
  me:`<h1>Кабинет</h1><div class="card">Никнейм: <b>${u.nick}</b><br>Звание: ${u.rank}<br>Уровень: ${u.level}</div><button onclick="logout()">Чыгуу</button>`
 };
 app.innerHTML=t[tab]+`<div style="height:70px"></div>
 <nav>${[['main','Главный'],['chat','Чат'],['mission','Миссия'],['me','Кабинет']]
 .map(x=>`<button class="${x[0]==tab?'on':''}" onclick="home('${x[0]}')">${x[1]}</button>`).join('')}</nav>`;
}
function logout(){localStorage.removeItem('me');authView(false)}
get('me')?home('main'):authView(true);
</script>
</body>
</html>
